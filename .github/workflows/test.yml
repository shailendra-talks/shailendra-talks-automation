
name: Shailendra Talks - AI Voice Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.scripts

      - name: Generate AI voice
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python -m src.voice

      - name: Save script and voice
        uses: actions/upload-artifact@v4
        with:
          name: shailendra-talks-audio
          path: |
            output/short_script.txt
            output/voiceover.wav
          if-no-files-found: error
