
name: Shailendra Talks - AI Shorts Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate AI script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.scripts

      - name: Generate AI voice
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python -m src.voice

      - name: Generate YouTube Shorts video
        run: python -m src.video

      - name: Save final video and assets
        uses: actions/upload-artifact@v4
        with:
          name: shailendra-talks-final-video
          path: |
            output/short_video.mp4
            output/short_script.txt
            output/voiceover.wav
            output/captions.srt
          if-no-files-found: error
