
name: Shailendra Talks - AI Shorts Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Restore Pixabay video cache
        uses: actions/cache@v4
        with:
          path: output/pixabay_cache.json
          key: pixabay-video-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pixabay-video-cache-

      - name: Generate AI script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.scripts

      - name: Generate AI voice
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python -m src.voice

      - name: Generate Hybrid Documentary Video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m src.video

      - name: Save final video and assets
        uses: actions/upload-artifact@v4
        with:
          name: shailendra-talks-final-video
          path: |
            output/short_video.mp4
            output/short_script.txt
            output/voiceover.wav
            output/captions.srt
            output/pixabay_credits.txt
          if-no-files-found: error
          retention-days: 7
